# Rebuilds ru/, en/, sitemap.xml, robots.txt and the generated parts of index.html
# (head tags + prerendered offers table) whenever index.html or the build script
# changes, and commits the result.
name: Build language pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Generate pages
        run: python tools/build.py
      - name: Commit changes, if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A index.html ru en sitemap.xml robots.txt
            git commit -m "Rebuild language pages and sitemap"
            git push
          else
            echo "Generated files are already up to date."
          fi
